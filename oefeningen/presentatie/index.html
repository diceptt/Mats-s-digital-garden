# Onderwerp

Wat is jouw interesse, waarom, wat, hoe (cultuur, vakmanschap, sport, idool, ​hobby, passie categorie enz.) toon een hoeveelheid afbeeldingen.​

Het onderwerp van mijn digital garden wordt muziek. Ik denk dat dit een van de dingen is die de grootste impact op mijn leven heeft en waar ik dan ook enorm veel mee bezig ben.
Ik luister altijd naar muziek, of het nou onderweg naar school, thuis, tijdens werk of zelfs voor het slapen is. Ik vind het leuk om nieuwe muziek te ontdekken en er is 
eigenlijk oneindig veel om te ontdekken in de muziek. Ook is het een manier voor mensen om samen te komen, los te laten, te delen en nog zoveel meer.

# 10 links

Welke 10 links heb je gelezen, geraadpleegd ter inspiratie, verdieping? Wat heb je daaruit gehaald?
1. https://magazine.hms.harvard.edu/articles/how-music-resonates-brain
2. https://lhstoday.org/42242/opinion/musics-impact-and-influence-on-everyday-life/
3. https://www.savethemusic.org/blog/how-does-music-affect-society/
4. https://www.musicgenreslist.com/
5. https://musicmap.info/
6. https://www.youtube.com/watch?v=7gIwPimylnU
7. https://playingforchange.org/the-history-of-music-through-40-masterpieces/
8. https://herseninstituut.nl/nieuws/muziek-en-het-brein/
9. https://npokennis.nl/video/77/wat-doet-muziek-met-je-brein
10. https://www.examenoverzicht.nl/examen-informatie/leren/leren-met-muziek

Wat ik hieruit heb gehaald is dat muziek bijna alle hersengebieden tegelijk aanzet (emotie, geheugen, motoriek en gehoor),
ook zorgt het voor de aanmaak van gelukshormonen, verlaagt het stress en versterkt het de verbindingen in de hersenen. Daarnaast
heeft het ook therapeutische voordelen, bijvoorbeeld bij revalidatie (van parkinson/dementie). Het heeft ook invloed op de focus en/of stemming van een persoon.
Als laatste dient muziek als een sociaal bindmiddel, speelt het een rol bij maatschappelijke veranderingen en staat het nooit stil (muziek blijft altijd evalueren en veranderen, net als onze digital gardens :] )

# Zoek 50 afbeeldingen

Waarom kies je specifiek voor deze verzameling? Zijn er patronen te ontdekken? Heeft
alles een specifieke kleurstelling? Herken je een actie, een gevoel, een materiaal of
een standpunt? Wat is kenmerkend voor deze verzameling? Welke dingen komen steeds terug?

Ik kies specifiek voor deze verzameling omdat de verzameling laat zien hoe breed, persoonlijk en visueel de beleving van muziek is. Het combineert genres zoals indie rock (bijv. Radiohead en Panchiko), R&B (Bryson Tiller) en jazz (Berlioz) met het gevoel en de cultuur rondom muziek luisteren.
Wat patronen die opvallen zijn bijvoorbeeld de afwisseling tussen analoge muziek (platenspelers,mp3 spelers, cds) en grafische posters met opvallende typografie. Ook is de luisteraar zelf te zien, in de vorm van bijvoorbeeld een stripfiguur dat helemaal opgaat in de muziek.
De kleurstelling is erg warm en nostalgisch. Kleuren die daarbij passen zijn bijvoorbeeld okergeel, oranje, dieprood, olijfgroen en aardetinten. Dit doet mij denken aan vintage, oud papier en oude opnames.
Een actie/gevoel: Opgaan in de muziek. Een materiaal dat vrijwel altijd voorkomt zijn tastbare / draagbare muziekspelers (platenspeler, cdspeler, walkman, mp3speler etc.).
Dingen die veel terugkomen zijn koptelefoons / oortjes, muziekinstrumenten, platen, vintage posters met expressieve typografie, specifieke artiesten waar ik interesse in heb.

# Introtekst

Ik wil een ander vertellen wat voor invloed muziek kan hebben op hun leven, hun gemoedstoestand en 
ze nieuwe / bekende muziek laten (her)ontdekken.

### Hoe denk je dit te vertellen met eigen content? 
Ik denk dit te vertellen door een visueel verhaal te vormen, aan de hand van bestaande albums / muziek waar ik naar luister (als persoonlijk tintje)
Door tussendoor te linken naar afspeellijsten, artiesten, onderzoeken en andere informatie kan ik mijn punten versterken / bewijzen

### Eerste stukje content.
Muziek is overal: onderweg, tijdens werk, op school of om even te ontspannen. Ik deel hier graag wat dit met je kan doen en help je (misschien) nieuwe muziek ontdekken.
